aid: slate-auto
name: Slate Auto
description: >-
  Slate Auto is an American electric-vehicle manufacturer building a radically
  simple, affordable, and customizable electric pickup truck. Designed in
  California and Michigan, engineered in Michigan, and assembled in the Midwest,
  the "Blank Slate" starts around $24,950 and offers roughly 205 miles of range,
  with interchangeable body panels and 200+ accessories that let owners
  reconfigure the vehicle over its life (including SUV and Fastback body styles).
  Slate sells direct through a preorder/reservation model, rejects mandatory
  feature packages and large touchscreens in favor of durability and owner
  control, and offers fleet solutions. Backed by General Catalyst. As a consumer
  automaker, Slate Auto publishes no public developer API, SDKs, or
  developer portal at this time; this profile captures company identity for the
  API Evangelist network.
